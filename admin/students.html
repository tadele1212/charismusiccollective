<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approved Students | Admin | Charis Music Collective</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <img src="../assets/images/logo.png" alt="Logo">
      <h3>CHARIS ADMIN</h3>
    </div>

    <nav class="sidebar-menu">
      <a href="index.html" class="sidebar-link"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="registrations.html" class="sidebar-link"><i class="fas fa-id-card"></i> Registrations</a>
      <a href="students.html" class="sidebar-link active"><i class="fas fa-user-graduate"></i> Approved Students</a>
      <a href="programs.html" class="sidebar-link"><i class="fas fa-music"></i> Programs</a>
      <a href="instruments.html" class="sidebar-link"><i class="fas fa-guitar"></i> Instruments</a>
      <a href="payments.html" class="sidebar-link"><i class="fas fa-credit-card"></i> Payment Settings</a>
      <a href="messages.html" class="sidebar-link"><i class="fas fa-envelope"></i> Messages</a>
      <a href="settings.html" class="sidebar-link"><i class="fas fa-cog"></i> Site Settings</a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-secondary btn-block btn-sm" onclick="adminLogout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-page-title">
        <h2>Officially Enrolled Students</h2>
      </div>
      <div class="admin-user-menu">
        <a href="../index.html" target="_blank" class="btn btn-secondary btn-sm"><i class="fas fa-external-link-alt"></i> View Site</a>
      </div>
    </header>

    <div class="admin-content">
      
      <div class="table-wrapper">
        <div class="table-toolbar">
          <h3>Active Verified Student Roster</h3>
        </div>

        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Student Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Enrolled Program</th>
                <th>Format</th>
                <th>Contact Action</th>
              </tr>
            </thead>
            <tbody id="students-tbody">
              <!-- Rendered by admin-dashboard.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/main.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
