<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Settings | Admin | Charis Music Collective</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <img src="../assets/images/logo.png" alt="Logo">
      <h3>CHARIS ADMIN</h3>
    </div>

    <nav class="sidebar-menu">
      <a href="index.html" class="sidebar-link"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a href="registrations.html" class="sidebar-link"><i class="fas fa-id-card"></i> Registrations</a>
      <a href="students.html" class="sidebar-link"><i class="fas fa-user-graduate"></i> Approved Students</a>
      <a href="programs.html" class="sidebar-link"><i class="fas fa-music"></i> Programs</a>
      <a href="instruments.html" class="sidebar-link"><i class="fas fa-guitar"></i> Instruments</a>
      <a href="payments.html" class="sidebar-link"><i class="fas fa-credit-card"></i> Payment Settings</a>
      <a href="messages.html" class="sidebar-link"><i class="fas fa-envelope"></i> Messages</a>
      <a href="settings.html" class="sidebar-link active"><i class="fas fa-cog"></i> Site Settings</a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-secondary btn-block btn-sm" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div class="admin-page-title">
        <h2>General Website & Branding Settings</h2>
      </div>
      <div class="admin-user-menu">
        <a href="../index.html" target="_blank" class="btn btn-secondary btn-sm"><i class="fas fa-external-link-alt"></i> View Main Site</a>
      </div>
    </header>

    <div class="admin-content" style="max-width: 800px;">
      
      <div class="card" style="border-color: var(--orange-border); padding: 2.5rem;">
        <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--bright-orange);"><i class="fas fa-sliders-h"></i> School Information & Hero Messaging</h3>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Manage public contact information, phone numbers, and hero taglines.</p>

        <form id="general-settings-form">
          <div class="form-group">
            <label class="form-label" for="schoolName">School Name</label>
            <input type="text" id="schoolName" class="form-control" value="Charis Music Collective" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="phone">Primary Phone Number</label>
              <input type="text" id="phone" class="form-control" value="+251 910 070 940" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="email">Contact Email</label>
              <input type="email" id="email" class="form-control" value="contact@charismusiccollective.com" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="whatsapp">WhatsApp Number</label>
              <input type="text" id="whatsapp" class="form-control" value="+251910070940" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="telegramUsername">Instructor Telegram Handle</label>
              <input type="text" id="telegramUsername" class="form-control" value="IyasuMarkos" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="heroTitle">Hero Main Slogan</label>
            <input type="text" id="heroTitle" class="form-control" value="LEARN MUSIC. CREATE YOUR SOUND." required>
          </div>

          <div class="form-group">
            <label class="form-label" for="heroSubtitle">Hero Supporting Subtitle</label>
            <input type="text" id="heroSubtitle" class="form-control" value="ONLINE & IN-PERSON MUSIC CLASSES" required>
          </div>

          <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-primary btn-block" style="padding: 1rem;">
              SAVE WEBSITE SETTINGS <i class="fas fa-save"></i>
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/main.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
