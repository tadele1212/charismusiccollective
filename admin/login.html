<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Charis Music Collective</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body style="background: radial-gradient(circle at 50% 30%, rgba(244,123,32,0.15) 0%, rgba(5,5,5,1) 70%); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="card" style="width: 100%; max-width: 440px; border-color: var(--orange-border); padding: 3rem 2.2rem; box-shadow: var(--glow-orange-lg); background: rgba(17, 17, 17, 0.95);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="../assets/images/logo.png" alt="Charis Music Collective Logo" style="height: 55px; margin: 0 auto 1rem auto;">
      <h2 style="font-size: 1.6rem;">ADMIN PORTAL</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access student registrations & system settings.</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" class="form-control" value="admin@charis.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="form-control" value="admin123" required>
      </div>

      <div style="margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        Default Credentials: <code>admin@charis.com</code> / <code>admin123</code>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.9rem;">
        LOGIN TO DASHBOARD <i class="fas fa-lock"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.8rem;">
      <a href="../index.html" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Return to Main Website</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/main.js"></script>
  <script src="js/admin-auth.js"></script>
</body>
</html>
